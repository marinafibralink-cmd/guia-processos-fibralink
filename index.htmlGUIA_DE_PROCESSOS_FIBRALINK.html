<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guia de Processos | Sistema IXC</title>
<style>
:root {
  --navy:#071b33; --blue:#123d70; --ink:#17365d; --mid:#2f67a4; --light:#eef5fc;
  --line:#d9e4ef; --text:#203047; --muted:#68788d; --white:#fff; --shadow:0 10px 30px rgba(7,27,51,.09);
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f8fc;color:var(--text);}
header{background:linear-gradient(135deg,var(--navy),#123f73);color:white;padding:28px 34px 24px;position:sticky;top:0;z-index:10;box-shadow:0 5px 20px rgba(0,0,0,.12)}
.top{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand small{letter-spacing:2px;opacity:.7;font-weight:700} .brand h1{margin:5px 0 0;font-size:28px;letter-spacing:-.5px}
.search{width:min(430px,45vw);position:relative} .search input{width:100%;padding:14px 18px 14px 44px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.12);color:white;outline:none;font-size:14px}
.search input::placeholder{color:#d7e4f2} .search span{position:absolute;left:16px;top:13px}
.wrap{max-width:1250px;margin:auto;padding:26px 24px 60px}
.nav{display:flex;gap:8px;overflow:auto;padding-bottom:10px;margin-bottom:22px;scrollbar-width:thin}
.tab{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;transition:.18s}
.tab:hover,.tab.active{background:var(--blue);color:white;border-color:var(--blue);transform:translateY(-1px)}
.hero{background:white;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);margin-bottom:22px}
.hero .eyebrow{color:var(--mid);font-size:12px;font-weight:800;letter-spacing:1.2px}
.hero h2{margin:6px 0 6px;font-size:27px;color:var(--navy)} .hero p{margin:0;color:var(--muted)}
.progress{height:5px;background:#e6edf5;border-radius:10px;margin-top:18px;overflow:hidden} .progress i{display:block;height:100%;background:var(--mid);width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px rgba(7,27,51,.055);overflow:hidden}
.cardhead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;cursor:pointer}
.cardhead h3{margin:0;font-size:15px;color:var(--ink)} .chev{color:var(--mid);font-weight:900}
.cardbody{padding:16px 20px} .cardbody ul{margin:0;padding-left:20px} .cardbody li{margin:9px 0;line-height:1.45;font-size:14px}
.note{margin-top:20px;background:#fff8df;border:1px solid #f0df9b;border-left:4px solid #c59b16;border-radius:10px;padding:14px 16px;color:#6a5510;font-size:13px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:var(--light);color:var(--blue);font-size:11px;font-weight:800;margin-bottom:12px}
.empty{text-align:center;padding:50px;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:14px}
.footer{text-align:center;color:#8190a2;font-size:12px;padding:30px}
@media(max-width:800px){.top{align-items:flex-start;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.wrap{padding:18px 14px 40px}header{padding:20px 18px}}
</style>
</head>
<body>
<header>
 <div class="top">
  <div class="brand"><small>FIBRALINK • OPERAÇÃO</small><h1>Guia de Processos | Sistema IXC</h1></div>
  <div class="search"><span>⌕</span><input id="q" placeholder="Pesquisar processo ou palavra-chave..." oninput="search(this.value)"></div>
 </div>
</header>
<main class="wrap">
 <div id="tabs" class="nav"></div>
 <section id="content"></section>
 <div class="footer">Guia de consulta operacional • Conteúdo estruturado a partir do manual fornecido.</div>
</main>
<script>
const DATA=[{"id": "001", "title": "Cadastros de Leads", "desc": "Cadastro e qualificação de leads através do Kanban", "groups": [{"title": "Acesso", "steps": ["Abrir o IXC", "Abrir o Inmap Sales", "Abrir o quadro Kanban."]}, {"title": "Antes de cadastrar", "steps": ["Verificar se está no quadro de Leads ou Negociações.", "No botão de Rastreio do Painel Operacional, verificar se já existe lead com o mesmo telefone para evitar duplicidade."]}, {"title": "Cadastro", "steps": ["Clicar em Adicionar Lead.", "Inserir nome, celular (obrigatório) e endereço.", "Preencher as informações do endereço.", "Clicar em Localização para marcar as coordenadas (obrigatório).", "Conferir o local exato e clicar em Atualizar Coordenadas.", "Clicar em Cadastrar."]}, {"title": "Resultado da viabilidade", "steps": ["O sistema informará se o endereço é Viável ou Inviável."]}, {"title": "Lead inviável", "steps": ["Selecionar Segmento justificando o motivo da inativação.", "Clicar em Inativar Lead."]}, {"title": "Lead viável / negociação", "steps": ["Após cadastrar, preencher as informações de CRM já captadas e clicar em Gerar Negociação.", "Selecionar o plano “Atenção - Plano ainda não escolhido”.", "Toda lead com endereço/localização confirmada e viabilizada deverá estar na etapa de Negociação.", "Gerar anotações para criar histórico dos contatos realizados durante a negociação."]}]}, {"id": "002", "title": "Convertendo em Venda", "desc": "Conversão da negociação em venda e criação dos registros necessários", "groups": [{"title": "Antes de concluir", "steps": ["Se o endereço não estiver completo, com complemento e referência, editar o cliente na etapa de Prospecção pelo Sales ou IXC.", "Conferir se a localização/coordenadas estão atualizadas e exatas."]}, {"title": "Concluir venda", "steps": ["Na negociação aberta, alterar o plano para o escolhido pelo cliente e preencher as demais informações necessárias.", "Clicar em Vencemos → Vencemos Wizard."]}, {"title": "Campos obrigatórios", "steps": ["Canal de venda", "Campanha", "Concorrente", "Perfil"]}, {"title": "Central do assinante", "steps": ["Após o Vencemos Wizard, criar o acesso da Central do Assinante.", "E-mail: utilizar o e-mail do cliente.", "Senha: CPF sem pontos e traços.", "Copiar o código ID da negociação para uso posterior."]}, {"title": "Acesso / PPPoE", "steps": ["Tipo de cobrança: data de vencimento escolhida pelo cliente (05/10/15).", "Acesso é o PPPoE do cliente; atenção para não cadastrar incorretamente.", "Formato: primeiro nome + último nome + ID da negociação + @cidade, conforme a cidade.", "Guapimirim: @GUAPIMIRIM", "Santa Cruz: @FIBRALINK", "Petrópolis: @PETROPOLIS", "Piabetá: sem @.", "Senha: 1234."]}, {"title": "Instalação", "steps": ["Selecionar a caixa de atendimento mais próxima.", "Selecionar a porta em ordem de disponibilidade.", "Atendimento: assunto “Instalação de Clientes”.", "Descrição padrão: data da instalação, número para contato, turno de preferência (se houver), complemento, referência, plano escolhido e vendedor(a)."]}, {"title": "O.S. e pós-venda", "steps": ["Tarefa pós-venda: deixar marcado para não criar; não colocar data ou hora; finalizar.", "Localizar cliente no IXC ou Sales → aba O.S → Nova.", "Assunto: ID 52 para residencial e ID 310 para predial.", "Setor: 24 Fibralink.", "Repetir a descrição padrão e salvar.", "Em Datas e Horários, preencher data reservada e data prazo limite.", "Em Arquivos, anexar selfie / Serasa / termo de adesão após OK do cliente.", "Após enviar o termo: preencher planilha individual de vendas e atualizar ranking no WhatsApp."]}]}, {"id": "003", "title": "Abertura de Atendimento", "desc": "Suporte técnico e reparo", "groups": [{"title": "Suporte / reparo", "steps": ["IXC → Cadastros → Clientes → selecionar cliente.", "Atendimentos → Novo → selecionar login correto.", "Assunto: Suporte (sem conexão), Suporte – Lentidão ou Suporte – Wi-Fi.", "Departamento: Comercial.", "Descrição: relatar problema e colocar contato do cliente.", "Salvar e assumir/transferir o atendimento para o departamento responsável."]}, {"title": "Regra de conexão", "steps": ["Menos de 1 dia sem conexão: abrir Suporte, não abrir Reparo/O.S.", "Mais de 1 dia sem conexão: não enviar no OPA; abrir O.S. com assunto Reparo, seguir padrão, salvar e reservar data."]}]}, {"id": "004", "title": "Inclusão de Rede Mesh", "desc": "Inclusão de roteador adicional Wi-Fi 6 Mesh", "groups": [{"title": "Regra", "steps": ["A solicitação deve ser feita pelo titular adimplente."]}, {"title": "Contrato / serviço", "steps": ["Cadastros → Contratos → selecionar contrato.", "Serviços Adicionais → Novo.", "ID 72 – Roteador Adicional Wi-Fi 6 Mesh.", "Descrição: Inclusão de Rede Mesh.", "Salvar."]}, {"title": "Atendimento", "steps": ["Assunto: Loja – Adesão (ID 161).", "Departamento: Comercial.", "Origem: Login.", "Descrição: Inclusão de Rede Mesh; cliente ciente do acréscimo de R$ 29,90 mensal.", "Salvar."]}, {"title": "O.S.", "steps": ["Nova O.S.", "Assunto: Instalação Ponto Extra Wi-Fi (ID 54).", "Origem: Login.", "Colaborador responsável: deixar em branco.", "Setor: 24 Fibralink.", "Salvar e preencher data reservada."]}]}, {"id": "005", "title": "Recebimento de Equipamento em Loja", "desc": "Registro da entrega de equipamento pelo cliente", "groups": [{"title": "Atendimento", "steps": ["Cadastros → Clientes → Atendimento Novo.", "Assunto: Retirada de Equipamento (ID 4).", "Departamento: Comercial.", "Descrição: “Cliente entregou equipamento em loja dia XX/XX/XXXX”.", "Salvar."]}]}, {"id": "006", "title": "Troca de Localidade", "desc": "Atualização do endereço e abertura da O.S.", "groups": [{"title": "Cliente / endereço", "steps": ["Cadastros → Clientes.", "Atualizar endereço completo.", "Atualizar endereço de cobrança.", "Salvar."]}, {"title": "Contrato", "steps": ["Entrar no contrato → Menu (⋮) → Endereço → Atualizar → Salvar."]}, {"title": "Atendimento", "steps": ["Assunto: Troca de Localidade (ID 247).", "Departamento: Comercial.", "Descrição padrão: cliente solicitou troca de localidade; de endereço antigo; para endereço novo.", "Informar pagamento da taxa (R$ 59,90) + data, se for cobrar.", "Informar telefone de contato e salvar."]}, {"title": "O.S.", "steps": ["Nova.", "Assunto: Instalação Troca de Localidade (ID 82) ou Predial Troca de Localidade (ID 311).", "Origem: Login.", "Setor: Fibralink (ID 24).", "Colaborador: em branco.", "Salvar → data reservada."]}, {"title": "Conferência crítica", "steps": ["Verificar se o endereço foi alterado no cadastro, no contrato, na ordem de serviço e no login."]}]}, {"id": "007", "title": "Segundo Ponto", "desc": "Criação e agendamento de segundo ponto", "groups": [{"title": "Antes de iniciar", "steps": ["Verificar débitos."]}, {"title": "Negociação", "steps": ["Inmap Sales → Negociações → Novo.", "Selecionar plano.", "Canal: Concorrente.", "Não zerar taxa de instalação.", "Salvar."]}, {"title": "Contrato / endereço", "steps": ["Contrato: tipo de cobrança, modelo de impressão e vendedor; salvar.", "Endereço: desmarcar “Considerar endereço padrão”; preencher endereço do segundo ponto; verificar duplicidade; marcar coordenadas; salvar."]}, {"title": "Acesso", "steps": ["Criar login PPPoE: nome + nome do meio + ID negociação + @cidade, se houver.", "Senha: 1234.", "Salvar."]}, {"title": "Vencemos / atendimento / O.S.", "steps": ["Vencemos: conferir negociações; selecionar caixa e porta.", "Atendimento: assunto Instalação de Clientes; colar texto padrão; pós-tarefa: opção 5; não colocar data; finalizar.", "O.S.: Nova; selecionar login do segundo ponto; ajustar técnico; colar texto; salvar → agendar."]}, {"title": "Conferência crítica", "steps": ["Verificar se o endereço foi alterado no cadastro, contrato, O.S. e login."]}]}, {"id": "008", "title": "Impressão de Boleto", "desc": "Localização, impressão e registro do atendimento", "groups": [{"title": "Impressão", "steps": ["IXC → Clientes → Financeiro.", "Localizar boleto “A Receber”.", "Selecionar → Imprimir Boletos.", "Layout: 1 por página."]}, {"title": "Registro", "steps": ["Atendimento → Novo → Assunto → Descrição.", "Descrição: titular / pessoa autorizada em loja fazendo impressão de boleto.", "Salvar."]}, {"title": "Finalização", "steps": ["Ações → Interagir → repetir texto da descrição → Status: Solucionado."]}]}, {"id": "009", "title": "Desbloqueio de Confiança", "desc": "Desbloqueio de confiança do contrato", "groups": [{"title": "Acesso", "steps": ["Clientes → Contratos → selecionar contrato → Ações → Desbloqueio de Confiança."]}]}, {"id": "010", "title": "Verificar Conexão do Cliente", "desc": "Diagnóstico rápido da conexão", "groups": [{"title": "Verificação", "steps": ["Clientes → Login.", "Verificar IPv4 (100.XX.XX.X).", "Sem IPv4 = sem conexão.", "Confirmar se não há inadimplência.", "Clicar em Diagnóstico → rolar até o final → verificar último STOP."]}]}, {"id": "011", "title": "Finalizar Atendimento", "desc": "Encerramento correto do atendimento", "groups": [{"title": "Finalização", "steps": ["Ações → Interagir.", "Preencher mensagem com o que foi executado.", "Status: Solucionado.", "Salvar."]}]}, {"id": "012", "title": "Gerar Boleto", "desc": "Geração de boleto/taxa e financeiro", "groups": [{"title": "Venda", "steps": ["Clientes → Contrato → Venda → Novo.", "Se filial = 1, mudar para 2.", "Tipo documento: 501.", "Condição: À vista.", "Documento: “Taxa de…”.", "Repetir na observação.", "Competência.", "Salvar."]}, {"title": "Produtos", "steps": ["Novo.", "Selecionar o tipo correto de taxa.", "Quantidade: 1.", "Ajustar valor.", "Salvar.", "Finalizar saída.", "Carteira 6.", "Salvar e gerar financeiro.", "Validar e finalizar."]}]}, {"id": "013", "title": "Reagendar O.S.", "desc": "Reagendamento de ordem de serviço", "groups": [{"title": "Reagendamento", "steps": ["Ações → Necessário Reagendar → Motivo → Salvar.", "Ações → Agendar Novamente."]}]}, {"id": "014", "title": "Troca de Titularidade", "desc": "Transferência do contrato para novo titular", "groups": [{"title": "Verificação", "steps": ["Verificar débitos do titular atual."]}, {"title": "Novo titular", "steps": ["Cadastros → Clientes → Novo.", "Tipo cliente: 1.", "Nome + CPF.", "Salvar."]}, {"title": "Endereço / contato", "steps": ["Copiar endereço do titular antigo.", "Verificar duplicidade.", "Marcar coordenadas.", "Preencher endereço de cobrança.", "Contato: preencher contato e Central do Assinante.", "Salvar.", "Preencher também a aba de CRM com canal de venda = Troca de Titularidade."]}, {"title": "Negociação", "steps": ["CRM: canal de venda = Troca de Localidade (ID 47), conforme manual.", "Vencemos: mesmo plano e mesma data de vencimento.", "Salvar."]}, {"title": "Login / atendimento", "steps": ["Copiar login do antigo titular.", "No login antigo, acrescentar número 1.", "Senha: 1234.", "Atendimento: assunto ID 248; departamento ID 2.", "Descrição: cliente trocou titularidade de XXXX CPF XXX para XXXX CPF XXXX.", "Salvar → Ações → Interagir → repetir texto → Status Solucionado."]}, {"title": "Contratos / financeiro", "steps": ["Ativar contrato novo.", "Cancelar contrato antigo: Cancel/Negat/Desist; motivo ID 53; repetir texto; salvar.", "Status: cancelar contrato e gerar financeiro remanescente.", "Verificar se gerou proporcional corretamente e salvar."]}]}, {"id": "015", "title": "Impressão de Contrato", "desc": "Impressão e registro do contrato do cliente", "groups": [{"title": "Impressão", "steps": ["Cadastros → Clientes → selecionar cliente.", "Aba Contrato → botão Imprimir → selecionar Contrato.", "Descrição: “Impresso contrato do cliente em XX/XX/XXXX”.", "Salvar."]}]}, {"id": "016", "title": "Upgrade / Downgrade", "desc": "Alteração de plano do cliente", "groups": [{"title": "Atendimento", "steps": ["Abrir atendimento → Novo.", "Assunto: 250 (Comercial Loja – Upgrade/Downgrade).", "Departamento: Comercial.", "Salvar.", "Descrição: Cliente solicita alteração de plano X para plano X."]}, {"title": "Interação", "steps": ["Ações → Interagir.", "Mensagem: Cliente solicita alteração de plano X para plano X.", "Status: Solucionado.", "Salvar."]}, {"title": "Alteração Wizard", "steps": ["Na tela de Contrato, usar o botão Alteração Wizard (não entra no contrato).", "Selecionar tipo: Upgrade ou Downgrade → Próximo.", "Selecionar novo plano → Próximo duas vezes.", "Motivo do cancelamento: Alteração de contrato.", "Financeiro: Calcular → Próximo duas vezes.", "Finalização: Concluir alterações."]}, {"title": "Termo de adesão", "steps": ["Termo de Alteração de Plano – Upgrade/Downgrade.", "Registrar titular, plano anterior, velocidade e valor mensal; plano atualizado, velocidade e valor mensal.", "Fidelidade: benefícios vinculados a 12 meses; cancelamento antes do prazo gera multa proporcional ao período restante, conforme texto do manual."]}]}, {"id": "017", "title": "Verificar Capacidade da Agenda", "desc": "Consulta de ocupação de instalações", "groups": [{"title": "Consulta", "steps": ["Menu Suporte → Ordens de Serviço.", "Filtro: Assunto = Instalação.", "Filtro: Data Reservada.", "Verificar quantidade total já ocupada, independentemente de estar com status Aberta ou Agendada."]}]}, {"id": "INFO", "title": "Informações Gerais", "desc": "Taxas e padrões de PPPoE", "groups": [{"title": "Taxas", "steps": ["Rede Mesh: R$ 29,90 mensal.", "Taxa de instalação: R$ 89,90, podendo ser aplicado valor promocional mediante autorização da liderança.", "Troca de localidade: R$ 59,90.", "Troca de cômodo: R$ 19,90 se não houver troca de fibra; R$ 59,90 se houver troca de fibra.", "Ponto cabeado: R$ 29,90 contemplando até 15 metros de cabo UTP; R$ 1,50 por metro excedente."]}, {"title": "PPPoE", "steps": ["Guapimirim: @GUAPIMIRIM", "Santa Cruz: @FIBRALINK", "Petrópolis: @PETROPOLIS", "Piabetá: sem @."]}]}];
const tabs=document.getElementById('tabs'), content=document.getElementById('content');
let active='001';
function renderTabs(list=DATA){
 tabs.innerHTML='<button class="tab '+(active==='ALL'?'active':'')+'" onclick="selectAll()">VISÃO GERAL</button>';
 list.forEach(x=>tabs.innerHTML+=`<button class="tab ${x.id===active?'active':''}" onclick="openSection('${x.id}')">${x.title}</button>`);
}
function openSection(id){
 active=id; const s=DATA.find(x=>x.id===id); renderTabs();
 content.innerHTML=`<div class="hero"><span class="eyebrow">PROCESSO ${s.id}</span><h2>${s.title}</h2><p>${s.desc}</p><div class="progress"><i></i></div></div><div class="grid">${s.groups.map((g,i)=>card(g,i)).join('')}</div>`;
}
function card(g,i){return `<article class="card"><div class="cardhead" onclick="toggle(this)"><h3>${String(i+1).padStart(2,'0')} • ${g.title}</h3><span class="chev">−</span></div><div class="cardbody"><ul>${g.steps.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')}</ul></div></article>`}
function toggle(h){const b=h.nextElementSibling,c=h.querySelector('.chev'); if(b.style.display==='none'){b.style.display='block';c.textContent='−'}else{b.style.display='none';c.textContent='+'}}
function selectAll(){active='ALL';renderTabs();content.innerHTML=`<div class="hero"><span class="eyebrow">CENTRAL DE CONSULTA</span><h2>Todos os processos</h2><p>Selecione uma aba acima para acessar o passo a passo.</p></div><div class="grid">${DATA.map(s=>`<article class="card"><div class="cardhead" onclick="openSection('${s.id}')"><h3>${s.id==='INFO'?'INFORMAÇÕES':s.id} • ${s.title}</h3><span class="chev">›</span></div><div class="cardbody"><p>${s.desc}</p></div></article>`).join('')}</div>`}
function search(q){q=q.toLowerCase().trim(); if(!q){openSection(active==='ALL'?'001':active);return} const results=DATA.filter(s=>(s.id+' '+s.title+' '+s.desc+' '+JSON.stringify(s.groups)).toLowerCase().includes(q)); active='ALL'; renderTabs(results); content.innerHTML=results.length?`<div class="hero"><span class="eyebrow">RESULTADOS</span><h2>Busca: “${escapeHtml(q)}”</h2><p>${results.length} processo(s) encontrado(s).</p></div><div class="grid">${results.map(s=>`<article class="card"><div class="cardhead" onclick="openSection('${s.id}')"><h3>${s.id} • ${s.title}</h3><span class="chev">›</span></div><div class="cardbody"><p>${s.desc}</p></div></article>`).join('')}</div>`:'<div class="empty">Nenhum processo encontrado. Tente outro termo.</div>'}
function escapeHtml(v){return v.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
renderTabs(); openSection('001');
</script>
</body>
</html>
